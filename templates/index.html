<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Telegram Cloner Web</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div>
          <h1>Telegram Cloner веб</h1>
          <p id="status-badge" class="status-badge">Статус: Ожидаем входа</p>
        </div>
        <button class="primary ghost" onclick="refreshLogs()">Обновить логи</button>
      </header>

      <section class="panel">
        <h2>Настройки миграции</h2>
        <div class="grid">
          <div>
            <label>API ID</label>
            <input id="api-id" type="text" placeholder="1234567" />
          </div>
          <div>
            <label>API Hash</label>
            <input id="api-hash" type="password" placeholder="секретный ключ" />
          </div>
          <div>
            <label>Каналы-источники</label>
            <input id="source-ids" type="text" placeholder="-100123,-100456" />
          </div>
          <div>
            <label>Целевой канал</label>
            <input id="target-id" type="text" placeholder="-100789" />
          </div>
          <div>
            <label>Копировать с</label>
            <input id="date-from" type="date" />
          </div>
          <div class="actions">
            <button class="primary" onclick="start()">Начать миграцию</button>
            <button class="ghost" onclick="stop()">Остановить</button>
          </div>
        </div>
      </section>

      <section class="panel logs-panel">
        <h2>Логи</h2>
        <div class="logs" id="log-viewport"></div>
      </section>
    </div>

    <div class="modal" id="auth-modal">
      <div class="modal-card">
        <h3 id="modal-title">Введите номер телефона</h3>
        <p id="modal-note">Формат: +код страны и номер (например, +380501234567)</p>
        <input id="modal-input" type="text" placeholder="+380..." />
        <div class="modal-actions">
          <button class="primary" onclick="submitAuthStep()">Отправить</button>
          <button class="ghost" onclick="closeModal()">Отменить</button>
        </div>
      </div>
    </div>

    <script>
      let waitingFor = "idle";

      async function start() {
        const payload = {
          api_id: document.getElementById("api-id").value.trim(),
          api_hash: document.getElementById("api-hash").value.trim(),
          source_ids: document.getElementById("source-ids").value.trim(),
          target_id: document.getElementById("target-id").value.trim(),
          start_date: document.getElementById("date-from").value || null,
        };
        const res = await fetch("/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const error = await res.json();
          alert(error.error || "Ошибка запуска");
          return;
        }
        updateStatus("Запущена миграция. Ожидаем шаг авторизации.");
      }

      async function stop() {
        await fetch("/stop", { method: "POST" });
        updateStatus("Процесс остановлен.");
      }

      function showModal(step) {
        waitingFor = step;
        const labels = {
          phone: "Введите номер телефона",
          code: "Введите код из SMS",
          password: "Введите пароль 2FA",
        };
        const notes = {
          phone: "Номер в международном формате, например +380501234567",
          code: "Код высылается на привязанный Telegram",
          password: "Пароль нужно знать заранее",
        };
        document.getElementById("modal-title").innerText = labels[step];
        document.getElementById("modal-note").innerText = notes[step];
        document.getElementById("modal-input").value = "";
        document.getElementById("auth-modal").classList.add("visible");
      }

      function closeModal() {
        document.getElementById("auth-modal").removeAttribute("class");
      }

      async function submitAuthStep() {
        const value = document.getElementById("modal-input").value.trim();
        if (!value) {
          alert("Заполните поле.");
          return;
        }

        const res = await fetch("/auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ step: waitingFor, value }),
        });

        if (!res.ok) {
          const error = await res.json();
          alert(error.error || "Ошибка авторизации");
          return;
        }

        closeModal();
        if (waitingFor === "phone") {
          showModal("code");
          updateStatus("Ожидаем код (code).");
        } else if (waitingFor === "code") {
          updateStatus("Авторизовано. Ожидаем 2FA (если требуется).");
        } else if (waitingFor === "password") {
          updateStatus("Авторизовано (2FA).");
        }
      }

      async function logout() {
        await fetch("/logout", { method: "POST" });
        updateStatus("Ожидаем входа");
      }

      async function refreshLogs() {
        try {
          const res = await fetch("/logs");
          const data = await res.json();
          if (data.logs.length) {
            const viewport = document.getElementById("log-viewport");
            data.logs.forEach((line) => {
              const div = document.createElement("div");
              div.className = "log-line";
              div.innerText = line;
              viewport.appendChild(div);
            });
            viewport.scrollTop = viewport.scrollHeight;
          }
        } catch (error) {
          console.error("Не удалось обновить логи", error);
        }
      }

      async function pollStatus() {
        try {
          const res = await fetch("/status");
          const data = await res.json();
          const badge = document.getElementById("status-badge");
          if (data.authorized) {
            badge.innerText = `Авторизовано: ${data.current_phone || "неизвестно"}`;
            badge.classList.add("status-ok");
            badge.classList.remove("status-warn");
          } else {
            badge.innerText = `Статус: ожидаем ${data.waiting_for}`;
            badge.classList.add("status-warn");
            badge.classList.remove("status-ok");
            if (["phone", "code", "password"].includes(data.waiting_for)) {
              showModal(data.waiting_for);
            }
          }
        } catch (error) {
          console.error("Ошибка статуса", error);
        }
      }

      setInterval(pollStatus, 2000);
      setInterval(refreshLogs, 2000);
      pollStatus();
      refreshLogs();
    </script>
  </body>
</html>
